global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metrics_path: /metrics

  - job_name: 'vote-service'
    static_configs:
      - targets: ['votingapp-vote:80']
    metrics_path: '/metrics'
    scrape_interval: 5s

  # - job_name: 'result-service'
  #   static_configs:
  #     - targets: ['result:80']
  #   metrics_path: '/metrics'
  #   scrape_interval: 5s