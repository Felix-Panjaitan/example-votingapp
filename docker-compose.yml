version: '3'

services:
  vote:
    build: ./vote
    ports:
      - "4000:80"
    networks:
      - front-tier
      - back-tier
    depends_on:
      - redis

  result:
    build: ./result
    ports:
      - "4001:80"
    networks:
      - front-tier
      - back-tier
    depends_on:
      - db

  worker:
    build: ./worker
    networks:
      - back-tier
    depends_on:
      - redis
      - db

  redis:
    image: redis:alpine
    networks:
      - back-tier

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - back-tier
  
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    networks:
      - back-tier

  # Grafana
  grafana:
    image: grafana/grafana:latest
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    networks:
      - back-tier
    depends_on:
      - prometheus
    restart: always

  # Node exporter for host metrics
  node-exporter:
    image: prom/node-exporter:latest
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points="^/(sys|proc|dev|host|etc)($$|/)"'
    ports:
      - "9100:9100"
    networks:
      - back-tier
    restart: always

  # Postgres exporter for database metrics
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:postgres@db:5432/postgres?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - back-tier
    depends_on:
      - db
    restart: always

networks:
  front-tier:
  back-tier:

volumes:
  db-data:
  prometheus_data:
  grafana_data: