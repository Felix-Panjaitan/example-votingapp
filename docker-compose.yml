version: '3'

services:
  vote:
    build: ./vote
    container_name: votingapp-vote
    ports:
      - "4000:80"
    labels:
      - "service=vote"
      - "logging=promtail"
    networks:
      - front-tier
      - back-tier
    depends_on:
      - redis

  result:
    build: ./result
    container_name: votingapp-result
    ports:
      - "4001:80"
    labels:
      - "service=result"
      - "logging=promtail"
    networks:
      - front-tier
      - back-tier
    depends_on:
      - db

  worker:
    build: ./worker
    container_name: votingapp-worker
    labels:
      - "service=worker"
      - "logging=promtail"
    networks:
      - back-tier
    depends_on:
      - redis
      - db

  redis:
    image: redis:alpine
    container_name: votingapp-redis
    labels:
      - "service=redis"
      - "logging=promtail"
    networks:
      - back-tier

  db:
    image: postgres:15-alpine
    container_name: votingapp-db
    labels:
      - "service=db"
      - "logging=promtail"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - back-tier
  
  prometheus:
    image: prom/prometheus:latest
    container_name: votingapp-prometheus
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    networks:
      - back-tier

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: votingapp-grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    networks:
      - back-tier
    depends_on:
      - prometheus
      - loki
    restart: always

  loki:
    image: grafana/loki:2.9.0
    container_name: votingapp-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki:/etc/loki
      - loki_data:/loki
    networks:
      - back-tier
    restart: always

  # Promtail for log collection
  promtail:
    image: grafana/promtail:2.9.0
    container_name: votingapp-promtail
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail:/etc/promtail
    command: -config.file=/etc/promtail/config.yml
    networks:
      - back-tier
    depends_on:
      - loki
    restart: always

  # Node exporter for host metrics
  node-exporter:
    image: prom/node-exporter:latest
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points="^/(sys|proc|dev|host|etc)($$|/)"'
    ports:
      - "9100:9100"
    networks:
      - back-tier
    restart: always

  # Postgres exporter for database metrics
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:postgres@db:5432/postgres?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - back-tier
    depends_on:
      - db
    restart: always

networks:
  front-tier:
  back-tier:

volumes:
  db-data:
  prometheus_data:
  grafana_data:
  loki_data: