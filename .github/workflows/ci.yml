name: CI Pipeline

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches-ignore:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16.x'
    
    - name: Test vote service
      run: |
        cd vote
        pip install -r requirements.txt
        python -m pytest || echo "No tests available"
        
    - name: Test result service
      run: |
        cd result
        npm ci
        npm test || echo "No tests available"
  
  create-pr:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "feat: Auto-merge ${{ github.ref_name }} into main"
          body: "Auto-generated PR for branch `${{ github.ref_name }}`. Merging automatically."
          base: main
          branch: ${{ github.ref_name }}
          labels: auto-pr, auto-merge

      - name: Enable Auto-Merge
        if: steps.cpr.outputs.pull-request-number
        run: gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --auto --merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
