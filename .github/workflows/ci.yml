name: CI Pipeline

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches: [ feature/99-devops-setup ]
  pull_request:
    branches: [ feature/99-devops-setup ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16.x'
    
    - name: Test vote service
      run: |
        cd vote
        pip install -r requirements.txt
        python -m pytest || echo "No tests available"
        
    - name: Test result service
      run: |
        cd result
        npm ci
        npm test || echo "No tests available"
  
  create-pr:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create Pull Request to main
        # Give the step an ID to reference its output
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "feat: Auto PR for ${{ github.ref_name }}"
          body: "Auto-generated PR for branch `${{ github.ref_name }}`. Tests passed."
          base: main
          branch: ${{ github.ref_name }}
          labels: auto-pr
